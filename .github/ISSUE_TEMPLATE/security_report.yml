name: Security Report
description: Report a security vulnerability or vulnerability disclosure
title: "[SECURITY]: "
labels: ["security", "critical"]
body:
  - type: markdown
    attributes:
      value: |
        **IMPORTANT**: If this is a critical security vulnerability or secret exposure, please report privately to security@travelaiextractor.com or via GitHub Private Security Advisories.
  - type: textarea
    id: vulnerability
    attributes:
      label: Security Issue Description
      description: Describe the vulnerability or security flaw identified.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security Impact
      description: Describe the potential impact if exploited.
    validations:
      required: true

name: Continuous Integration

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Run Ruff Linter
        run: ruff check .

      - name: Check Black Formatting
        run: black --check .

      - name: Check isort Imports
        run: isort --check-only .

  test-and-coverage:
    name: Pytest Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (Tesseract & FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Pytest with Coverage
        env:
          GEMINI_API_KEY: "mock-gemini-key"
          GOOGLE_PLACES_API_KEY: "mock-places-key"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-report
          path: coverage.xml
          retention-days: 14

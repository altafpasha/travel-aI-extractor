name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration", "DevSecOps Security Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Deploy to Linux VPS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}
    needs: [] # In production, configured with workflow dependencies or status checks
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Deployment Configuration
        id: check_config
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "⚠️ VPS_HOST secret is not configured in GitHub Repository Secrets."
            echo "Please configure VPS_HOST, VPS_USERNAME, and VPS_SSH_KEY in repository secrets to enable VPS deployment."
            echo "skip_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "skip_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS via SSH & Run Health Verification
        if: steps.check_config.outputs.skip_deploy != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: PRODUCTION_ENV
          script: |
            set -e
            echo "Starting production deployment..."
            
            # Navigate to or clone project root on VPS
            if [ ! -d "$HOME/travel-ai-extractor" ]; then
              echo "Directory $HOME/travel-ai-extractor not found. Cloning repository..."
              git clone https://github.com/altafpasha/travel-aI-extractor.git "$HOME/travel-ai-extractor"
            fi
            cd "$HOME/travel-ai-extractor"
            git pull origin main
            
            # Inject production environment file if provided
            if [ -n "$PRODUCTION_ENV" ]; then
              echo "$PRODUCTION_ENV" > .env
              echo "✅ Written production .env file from PRODUCTION_ENV GitHub secret."
            fi
            
            # Rebuild and start production container stack
            echo "Rebuilding container stack via Docker Compose..."
            docker compose -f docker/docker-compose.yml up --build -d
            
            # Wait for container startup
            sleep 10
            
            # Health Verification
            echo "Executing post-deployment health check..."
            HEALTH_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "http://127.0.0.1:${PORT:-8085}/health" || echo "500")

            if [ "$HEALTH_STATUS" -eq 200 ]; then
              echo "✅ Health check PASSED (HTTP $HEALTH_STATUS). Deployment successful!"
            else
              echo "❌ Health check FAILED (HTTP $HEALTH_STATUS). Restarting container stack..."
              docker compose -f docker/docker-compose.yml restart
              exit 1
            fi

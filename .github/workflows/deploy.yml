name: Continuous Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Deploy to Linux VPS
    runs-on: ubuntu-latest
    needs: [] # In production, configured with workflow dependencies or status checks
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH & Run Health Verification
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "Starting production deployment..."
            
            # Navigate to project root on VPS
            cd /opt/travel-ai-extractor || cd ~/travel-ai-extractor
            
            # Pull latest git commit
            git pull origin main
            
            # Rebuild and start production container stack
            echo "Rebuilding container stack via Docker Compose..."
            docker compose -f docker/docker-compose.yml up --build -d
            
            # Wait for container startup
            sleep 10
            
            # Health Verification
            echo "Executing post-deployment health check..."
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "500")
            
            if [ "$HEALTH_STATUS" -eq 200 ]; then
              echo "✅ Health check PASSED (HTTP $HEALTH_STATUS). Deployment successful!"
            else
              echo "❌ Health check FAILED (HTTP $HEALTH_STATUS). Triggering automated rollback..."
              docker compose -f docker/docker-compose.yml rollback || docker compose -f docker/docker-compose.yml restart
              exit 1
            fi

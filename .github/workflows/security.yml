name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 02:00 UTC

jobs:
  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-sast:
    name: Bandit SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST Scan
        run: bandit -r app/ -lll -iii  # Fail on High severity / High confidence

  dependency-audit:
    name: pip-audit Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit Dependency Scan
        run: pip-audit -r requirements.txt --fail-under-chance 1.0 || true  # Audit dependencies

  docker-lint-and-scan:
    name: Container Security & SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

      - name: Trivy Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Build Production Docker Image
        run: docker build -f docker/Dockerfile -t travel-ai-extractor:latest .

      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'travel-ai-extractor:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: 'travel-ai-extractor:latest'
          format: 'spdx-json'
          output-file: 'sbom-spdx.json'

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: 'travel-ai-extractor:latest'
          format: 'cyclonedx-json'
          output-file: 'sbom-cyclonedx.json'

      - name: Upload SBOM Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          retention-days: 30

      - name: Install Cosign for Keyless Image Signing
        uses: sigstore/cosign-installer@v3.8.1

      - name: Document Cosign Image Signing Readiness
        run: |
          echo "Cosign installed. Image signing using GitHub OIDC Keyless signing prepared for container registry push."

services:
  db:
    image: postgres:16-alpine
    container_name: travel_ai_extractor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_ai_extractor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - travel_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1g
        reservations:
          cpus: '0.25'
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_ai_extractor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travel_ai_extractor_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - travel_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.1'
          memory: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: travel_ai_extractor_api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/travel_ai_extractor"
      REDIS_URL: "redis://redis:6379/0"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-mock-gemini-key}"
      GOOGLE_PLACES_API_KEY: "${GOOGLE_PLACES_API_KEY:-mock-places-key}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travel_net
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.travel-ai-api.rule=Host(`${DOMAIN:-travel-api.codesec.me}`)"
      - "traefik.http.routers.travel-ai-api.entrypoints=http,https,web,websecure"
      - "traefik.http.routers.travel-ai-api.tls=true"
      - "traefik.http.routers.travel-ai-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.travel-ai-api.loadbalancer.server.port=8000"
    volumes:
      - uploads_data:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
        reservations:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  travel_net:
    driver: bridge
  coolify:
    external: true

volumes:
  postgres_data:
  uploads_data:
